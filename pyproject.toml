[project]
name = "cislunar"
version = "0.0.1"
description = "Low-energy cislunar transfer design in the Earth-Moon CR3BP, built from scratch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cislunar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]
ignore = ["N802", "N803", "N806"]  # math notation (Phi, A, Oxx) reads better in capitals
